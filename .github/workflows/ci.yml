name: Test and build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.2.1
          poetry install --no-interaction --no-root
      - name: Test
        env:
          FORECAST_ENABLED: 'false'
        run: poetry run pytest -q
      - name: Build production image
        run: docker build -t forecast-ci .
      - name: Smoke test production image
        run: |
          docker run -d --name forecast-ci -e FORECAST_ENABLED=false -p 127.0.0.1:18000:8000 forecast-ci
          poetry run python scripts/smoke_api.py --url http://127.0.0.1:18000
      - name: Container logs
        if: failure()
        run: docker logs forecast-ci || true
      - name: Stop test container
        if: always()
        run: docker rm -f forecast-ci || true
